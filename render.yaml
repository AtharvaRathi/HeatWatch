databases:
  # PostgreSQL Database
  - name: heatwatch-db
    plan: free
    postgresMajorVersion: "15"

services:

  # Redis for Celery Broker
  - type: redis
    name: heatwatch-redis
    plan: free
    ipAllowList: [] # only allow internal connections

  # FastAPI Web Service + Celery (Unified for Free Tier)
  - type: web
    name: heatwatch-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: heatwatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: heatwatch-redis
          property: connectionString
      - key: OPENWEATHERMAP_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_API_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false # User will set this after Vercel deployment
