# ============================================
# CI/CD Pipeline - GitHub Actions
# Heatwave Prediction DevOps Project
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:

  # ---- Stage 1: Lint & Test ----
  test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm run test:run

  # ---- Stage 2: Build Docker Images ----
  build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service:
          - name: weather-service
            context: ./backend/microservices/weather-service
          - name: alert-service
            context: ./backend/microservices/alert-service
          - name: advisory-service
            context: ./backend/microservices/advisory-service
          - name: analytics-service
            context: ./backend/microservices/analytics-service
          - name: monolithic-server
            context: ./backend/monolithic
          - name: frontend
            context: ./frontend
          - name: nginx-gateway
            context: ./nginx

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Stage 3: Docker Compose Validation ----
  validate:
    name: ✅ Validate Docker Compose
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Microservices Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Monolithic Compose
        run: docker compose -f docker-compose.monolithic.yml config --quiet

  # ---- Stage 4: Integration Test ----
  integration:
    name: 🔗 Integration Test
    runs-on: ubuntu-latest
    needs: [build, validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start services with Docker Compose
        run: |
          docker compose up -d --build
          sleep 30

      - name: Health check - Weather Service
        run: curl --fail http://localhost:5001/api/weather/health

      - name: Health check - Alert Service
        run: curl --fail http://localhost:5002/api/alerts/health

      - name: Health check - Advisory Service
        run: curl --fail http://localhost:5003/api/advisory/health

      - name: Health check - Analytics Service
        run: curl --fail http://localhost:5004/api/analytics/health

      - name: Health check - Nginx Gateway
        run: curl --fail http://localhost:8080/gateway/health

      - name: Cleanup
        if: always()
        run: docker compose down -v
