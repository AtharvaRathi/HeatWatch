# ============================================
# NGINX API GATEWAY CONFIGURATION
# Reverse proxy routing for microservices
# ============================================

upstream weather_service {
    server weather-service:5001;
}

upstream alert_service {
    server alert-service:5002;
}

upstream advisory_service {
    server advisory-service:5003;
}

upstream analytics_service {
    server analytics-service:5004;
}

server {
    listen 80;
    server_name localhost;

    # ---- Frontend (React App) ----
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- Weather Service ----
    location /api/weather/ {
        proxy_pass http://weather_service/api/weather/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Alert Service ----
    location /api/alerts/ {
        proxy_pass http://alert_service/api/alerts/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Advisory Service ----
    location /api/advisory/ {
        proxy_pass http://advisory_service/api/advisory/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Analytics Service ----
    location /api/analytics/ {
        proxy_pass http://analytics_service/api/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Gateway Health Check ----
    location /gateway/health {
        return 200 '{"status":"ok","gateway":"nginx","architecture":"microservices"}';
        add_header Content-Type application/json;
    }
}
