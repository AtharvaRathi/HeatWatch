# Nginx API Gateway for Monolithic Architecture
# All API requests go to the single monolithic server

upstream monolithic_server {
    server monolithic-server:5000;
}

server {
    listen 80;
    server_name localhost;

    # ---- Frontend (React App) ----
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ---- ALL API routes go to single server ----
    location /api/ {
        proxy_pass http://monolithic_server/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Gateway Health Check ----
    location /gateway/health {
        return 200 '{"status":"ok","gateway":"nginx","architecture":"monolithic"}';
        add_header Content-Type application/json;
    }
}
