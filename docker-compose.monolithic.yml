# ============================================
# DOCKER COMPOSE - MONOLITHIC ARCHITECTURE
# ============================================
# Run: docker-compose -f docker-compose.monolithic.yml up --build
# This starts a SINGLE backend server that
# handles ALL API endpoints (weather, alerts,
# advisory, analytics) in one process.
# ============================================

services:

  # ---- MongoDB Database ----
  mongodb:
    image: mongo:7.0
    container_name: heatwave-mongodb-mono
    ports:
      - "27017:27017"
    volumes:
      - mongodb_mono_data:/data/db
    networks:
      - heatwave-mono-network
    restart: unless-stopped

  # ---- Single Monolithic Server ----
  monolithic-server:
    build:
      context: ./backend/monolithic
      dockerfile: Dockerfile
    container_name: heatwave-monolithic-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/heatwave_monolithic
    depends_on:
      - mongodb
    networks:
      - heatwave-mono-network
    restart: unless-stopped

  # ---- React Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: heatwave-frontend-mono
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - heatwave-mono-network
    restart: unless-stopped

  # ---- Nginx API Gateway (Monolithic Config) ----
  nginx-gateway:
    image: nginx:alpine
    container_name: heatwave-nginx-mono
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.monolithic.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - monolithic-server
      - frontend
    networks:
      - heatwave-mono-network
    restart: unless-stopped

volumes:
  mongodb_mono_data:
    driver: local

networks:
  heatwave-mono-network:
    driver: bridge
